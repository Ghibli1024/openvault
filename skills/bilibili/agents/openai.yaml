interface:
  display_name: "B站收藏到 Obsidian"
  short_description: "Export Bilibili favorites into an Obsidian-ready archive with folder, coarse-domain, and taxonomy views"
  default_prompt: "Use $bilibili-favorites-to-obsidian to export the current Bilibili account's video favorites into local Markdown. Collect the required inputs in a short one-question-at-a-time flow. Default target-root to /Users/Totoro/Library/Mobile Documents/iCloud~md~obsidian/Documents/Totoro/04-Resources, default container name to B站, default mode to merge, classification to auto, and title-language to zh. In merge flows, inspect the existing B站 archive first and preserve its current taxonomy, naming, and stable 搜索/废弃 contents. Generate 03 收藏夹, 04 领域, and the new independent 05 粗分类 view using the fixed coarse buckets AI与前沿科技、学习成长、工具效率、商业职场、生活见闻、资源内容、创作设计 instead of reusing 04 领域 top-level labels. Use Chinese top-level roots such as 01 日期, 04 领域, 06 搜索, and 07 废弃, and migrate older English-named roots into those canonical Chinese folders. If upgrading from the older layout, also migrate legacy Search/Rubbish roots into the current Chinese positions. After syncing, verify that 01 日期, 02 UP主, 03 收藏夹, 04 领域, 05 粗分类, 06 搜索, 07 废弃, and Dashboard.md exist, and report total videos, folder count, and new item count."
